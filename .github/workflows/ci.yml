name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hoodit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hoodit
      - run: cargo fmt --manifest-path apps/hoodit/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/hoodit/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/hoodit/Cargo.toml
